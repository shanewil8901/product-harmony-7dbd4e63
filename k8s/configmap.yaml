apiVersion: v1
kind: ConfigMap
metadata:
  name: erp-config
  labels:
    app.kubernetes.io/part-of: erp
data:
  PORT: "3000"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_DATABASE: "product_management"
  # Fresh MySQL volumes have no schema; "true" lets the backend create it.
  DB_SYNC: "true"
  JWT_EXPIRES_IN: "10m"
  KSA_COMPANY_PREFIX: "6281234"
  MAX_UPLOAD_MB: "10"
  PUBLIC_API_URL: "https://erp.example.com"
  API_PREFIX: "api/v1"
  CORS_ORIGIN: "https://erp.example.com"
  QUEUE_ENABLED: "true"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  QUEUE_PREFIX: "erp"

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "erp.fullname" . }}-config
  labels:
    {{- include "erp.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "erp.fullname" . }}-secrets
  labels:
    {{- include "erp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
